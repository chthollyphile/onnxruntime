name: Build and publish custom ORT Node

on:
  workflow_dispatch:
    inputs:
      version:
        description: npm package version
        required: true
        default: 1.29.0
        type: string
      npm_tag:
        description: npm dist-tag
        required: true
        default: latest
        type: string
      publish:
        description: Publish to npm after all builds pass
        required: true
        default: false
        type: boolean
  push:
    tags:
      - ort-node-v*

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  BUILD_CONFIG: Release
  NPM_PACKAGE_NAME: "@chthollyphile/onnxruntime-node-folia"

jobs:
  preflight:
    name: Verify official binary dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Check base-version binary sources
        shell: bash
        run: |
          ort_version="$(tr -d '\r\n' < VERSION_NUMBER)"
          metadata_version="$(node -p "require('./js/node/script/install-metadata-versions.js').nuget[0].version")"
          test "${metadata_version}" = "${ort_version}"

          dml_version="$(sed -n 's/.*id="Microsoft.AI.DirectML" version="\([^"]*\)".*/\1/p' packages.config)"
          test -n "${dml_version}"

          urls=(
            "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime.gpu.linux/${ort_version}/microsoft.ml.onnxruntime.gpu.linux.${ort_version}.nupkg"
            "https://api.nuget.org/v3-flatcontainer/microsoft.ai.directml/${dml_version}/microsoft.ai.directml.${dml_version}.nupkg"
            "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.8.2502/dxc_2025_02_20.zip"
          )
          for url in "${urls[@]}"; do
            curl --fail --silent --show-error --location --retry 3 --range 0-0 --output /dev/null "${url}"
            echo "Verified ${url}"
          done

  windows-webgpu-x64:
    name: Build win32-x64 and WebGPU host tools
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - uses: microsoft/onnxruntime-github-actions/setup-build-tools@v0.0.9
        with:
          vcpkg-version: '2025.08.27'
          vcpkg-hash: 9a4b32849792e13bee1d24726f073b3881acae4165206ddf1a6378e44a4ddd05b3ee93f55ff46d8e8873b3cbcd06606212989e248f0bd615a5bf365070074079
          cmake-version: '3.31.6'
          cmake-hash: 0f1584e8666cf4a65ec514bd02afe281caabf1d45d2c963f3151c41484f457386aa03273ab25776a670be02725354ce0b46f3a5121857416da37366342a833a0
          add-cmake-to-path: 'true'
          disable-terrapin: 'true'

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build Node binding
        shell: bash
        run: >-
          python tools/ci_build/build.py
          --build_dir build
          --config "${BUILD_CONFIG}"
          --update
          --build
          --parallel
          --skip_tests
          --build_shared_lib
          --build_nodejs
          --target nodejs_binding_wrapper
          --use_dml
          --use_webgpu

      - name: Test Node binding
        shell: bash
        run: npm --prefix js/node test -- --timeout=90000

      - name: Validate execution-provider matrix
        shell: bash
        run: |
          binding="js/node/bin/napi-v6/win32/x64/onnxruntime_binding.node"
          node - "${binding}" <<'NODE'
          const path = require('node:path');
          const actual = require(path.resolve(process.argv[2])).listSupportedBackends().map(({name}) => name);
          const expected = ['cpu', 'dml', 'webgpu'];
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Expected backends ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
          }
          console.log(`Validated backends: ${actual.join(', ')}`);
          NODE

      - name: Stage native files and WebGPU host tools
        shell: bash
        run: |
          source_dir="js/node/bin/napi-v6/win32/x64"
          target_dir="package-artifact/napi-v6/win32/x64"
          mkdir -p "${target_dir}" webgpu-host-tools
          for dependency in onnxruntime_binding.node onnxruntime.dll DirectML.dll dxil.dll dxcompiler.dll; do
            test -f "${source_dir}/${dependency}"
            cp -L "${source_dir}/${dependency}" "${target_dir}/"
          done

          tablegen_dir="build/Release/_deps/dawn-build/third_party/directx-shader-compiler/src/RelWithDebInfo/bin"
          for tool in llvm-tblgen.exe clang-tblgen.exe; do
            test -f "${tablegen_dir}/${tool}"
            cp -L "${tablegen_dir}/${tool}" webgpu-host-tools/
          done

      - uses: actions/upload-artifact@v7
        with:
          name: native-win32-x64
          path: package-artifact
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: windows-webgpu-host-tools
          path: webgpu-host-tools
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    needs: [preflight, windows-webgpu-x64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            build_args: --use_webgpu --enable_generic_interface
            expected_backends: cpu,webgpu,cuda,tensorrt
          - runner: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            build_args: ""
            expected_backends: cpu
          - runner: windows-11-arm
            platform: win32
            arch: arm64
            build_args: --arm64 --use_dml --use_webgpu
            expected_backends: cpu,dml,webgpu
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            build_args: --cmake_extra_defines CMAKE_OSX_ARCHITECTURES=x86_64
            expected_backends: cpu
          - runner: macos-15
            platform: darwin
            arch: arm64
            build_args: --use_coreml --use_webgpu --cmake_extra_defines CMAKE_OSX_ARCHITECTURES=arm64
            expected_backends: cpu,webgpu,coreml
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.platform == 'darwin' && '14.0' || '' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up pinned Windows build tools
        if: matrix.platform == 'win32'
        uses: microsoft/onnxruntime-github-actions/setup-build-tools@v0.0.9
        with:
          vcpkg-version: '2025.08.27'
          vcpkg-hash: 9a4b32849792e13bee1d24726f073b3881acae4165206ddf1a6378e44a4ddd05b3ee93f55ff46d8e8873b3cbcd06606212989e248f0bd615a5bf365070074079
          cmake-version: '3.31.6'
          cmake-hash: 0f1584e8666cf4a65ec514bd02afe281caabf1d45d2c963f3151c41484f457386aa03273ab25776a670be02725354ce0b46f3a5121857416da37366342a833a0
          add-cmake-to-path: 'true'
          disable-terrapin: 'true'

      - name: Set up pinned macOS build tools
        if: matrix.platform == 'darwin'
        uses: microsoft/onnxruntime-github-actions/setup-build-tools@v0.0.9
        with:
          vcpkg-version: '2025.08.27'
          vcpkg-hash: 9a4b32849792e13bee1d24726f073b3881acae4165206ddf1a6378e44a4ddd05b3ee93f55ff46d8e8873b3cbcd06606212989e248f0bd615a5bf365070074079
          cmake-version: '3.31.8'
          cmake-hash: 99cc9c63ae49f21253efb5921de2ba84ce136018abf08632c92c060ba91d552e0f6acc214e9ba8123dee0cf6d1cf089ca389e321879fd9d719a60d975bcffcc8
          add-cmake-to-path: 'true'
          disable-terrapin: 'true'

      - name: Download WebGPU host tools
        if: matrix.platform == 'win32' && matrix.arch == 'arm64'
        uses: actions/download-artifact@v8
        with:
          name: windows-webgpu-host-tools
          path: ${{ runner.temp }}/windows-webgpu-host-tools

      - name: Configure WebGPU host tools
        if: matrix.platform == 'win32' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $tools = (Resolve-Path '${{ runner.temp }}/windows-webgpu-host-tools').Path.Replace('\', '/')
          $llvmTablegen = "$tools/llvm-tblgen.exe"
          $clangTablegen = "$tools/clang-tblgen.exe"
          if (!(Test-Path $llvmTablegen) -or !(Test-Path $clangTablegen)) {
            throw "WebGPU host tablegen tools are missing from $tools"
          }
          "HOST_TOOL_BUILD_ARGS=--cmake_extra_defines LLVM_TABLEGEN=$llvmTablegen CLANG_TABLEGEN=$clangTablegen" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Node binding
        shell: bash
        run: >-
          python tools/ci_build/build.py
          --build_dir build
          --config "${BUILD_CONFIG}"
          --update
          --build
          --parallel
          --skip_tests
          --build_shared_lib
          --build_nodejs
          --target nodejs_binding_wrapper
          ${{ matrix.build_args }}
          ${HOST_TOOL_BUILD_ARGS:-}

      - name: Test Node binding
        shell: bash
        run: npm --prefix js/node test -- --timeout=90000

      - name: Validate execution-provider matrix
        shell: bash
        run: |
          binding="js/node/bin/napi-v6/${{ matrix.platform }}/${{ matrix.arch }}/onnxruntime_binding.node"
          node - "${binding}" "${{ matrix.expected_backends }}" <<'NODE'
          const path = require('node:path');
          const [bindingPath, expectedCsv] = process.argv.slice(2);
          const actual = require(path.resolve(bindingPath)).listSupportedBackends().map(({name}) => name);
          const expected = expectedCsv.split(',');
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Expected backends ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
          }
          console.log(`Validated backends: ${actual.join(', ')}`);
          NODE

      - name: Stage native files
        shell: bash
        run: |
          source_dir="js/node/bin/napi-v6/${{ matrix.platform }}/${{ matrix.arch }}"
          target_dir="package-artifact/napi-v6/${{ matrix.platform }}/${{ matrix.arch }}"
          test -f "${source_dir}/onnxruntime_binding.node"
          mkdir -p "${target_dir}"
          cp -L "${source_dir}/onnxruntime_binding.node" "${target_dir}/"
          case "${{ matrix.platform }}" in
            linux)
              cp -L "${source_dir}/libonnxruntime.so.1" "${target_dir}/"
              ;;
            win32)
              cp -L "${source_dir}/onnxruntime.dll" "${target_dir}/"
              for dependency in DirectML.dll dxil.dll dxcompiler.dll; do
                test -f "${source_dir}/${dependency}"
                cp -L "${source_dir}/${dependency}" "${target_dir}/"
              done
              ;;
            darwin)
              ort_version="$(tr -d '\r\n' < VERSION_NUMBER)"
              cp -L "${source_dir}/libonnxruntime.${ort_version}.dylib" "${target_dir}/"
              ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: package-artifact
          if-no-files-found: error
          retention-days: 7

  package:
    name: Assemble npm package
    needs: [build, windows-webgpu-x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      npm_tag: ${{ steps.metadata.outputs.npm_tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: js/node/bin
          merge-multiple: true

      - name: Resolve package metadata
        id: metadata
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_NPM_TAG: ${{ inputs.npm_tag }}
        run: |
          version="${DISPATCH_VERSION}"
          npm_tag="${DISPATCH_NPM_TAG:-latest}"
          if [[ "${GITHUB_REF}" == refs/tags/ort-node-v* ]]; then
            version="${GITHUB_REF_NAME#ort-node-v}"
          fi
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'npm_tag=%s\n' "${npm_tag}" >> "${GITHUB_OUTPUT}"

      - name: Build JavaScript and TypeScript files
        shell: bash
        run: |
          npm ci --prefix js
          npm ci --prefix js/common
          npm ci --prefix js/node

      - name: Configure and pack npm package
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          for target in \
            linux/x64 linux/arm64 \
            win32/x64 win32/arm64 \
            darwin/x64 darwin/arm64; do
            test -f "js/node/bin/napi-v6/${target}/onnxruntime_binding.node"
          done
          test -f js/node/bin/napi-v6/linux/x64/libonnxruntime.so.1
          test -f js/node/bin/napi-v6/linux/arm64/libonnxruntime.so.1
          test -f js/node/bin/napi-v6/win32/x64/onnxruntime.dll
          test -f js/node/bin/napi-v6/win32/arm64/onnxruntime.dll
          for target in win32/x64 win32/arm64; do
            for dependency in DirectML.dll dxil.dll dxcompiler.dll; do
              test -f "js/node/bin/napi-v6/${target}/${dependency}"
            done
          done
          ort_version="$(tr -d '\r\n' < VERSION_NUMBER)"
          test -f "js/node/bin/napi-v6/darwin/x64/libonnxruntime.${ort_version}.dylib"
          test -f "js/node/bin/napi-v6/darwin/arm64/libonnxruntime.${ort_version}.dylib"
          cd js/node
          npm pkg set \
            "name=${NPM_PACKAGE_NAME}" \
            "repository.url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          npm version "${PACKAGE_VERSION}" --no-git-tag-version --allow-same-version
          mkdir -p "${GITHUB_WORKSPACE}/npm-package"
          npm pack --pack-destination "${GITHUB_WORKSPACE}/npm-package"

      - uses: actions/upload-artifact@v7
        with:
          name: npm-package-${{ steps.metadata.outputs.version }}
          path: npm-package/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to npm
    needs: package
    if: startsWith(github.ref, 'refs/tags/ort-node-v') || inputs.publish == true
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@v8
        with:
          name: npm-package-${{ needs.package.outputs.version }}
          path: npm-package

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >-
          npm publish ./npm-package/*.tgz
          --access public
          --tag "${{ needs.package.outputs.npm_tag }}"
